# TicTacToe Configuration for Tako HRM

# Game selection
game: "tictactoe"  # Options: "tictactoe", "othello", "hex", "chess"

model:
  d_model: 128  # Reduced for TicTacToe simplicity (was 256)
  n_layers: 2  # Per module (4 total: 2 in L-module + 2 in H-module) (was 4)
  n_heads: 4  # Reduced (was 8)
  d_ff: 512  # Reduced (was 1024)
  N: 1  # cycles per segment (was 4) - TicTacToe needs minimal depth
  T: 4  # steps per cycle
  vocab_size: 128  # TicTacToe: 5 token types (0,1,2,3,4)
  action_size: 9  # 9 board positions

training:
  batch_size: 128
  learning_rate: 0.0005
  lr_schedule: cosine
  lr_min: 0.00005
  max_segments: 2  # Maximum segments during training (was 10) - TicTacToe needs minimal iterative refinement
  n_supervision: 2  # Number of segments for deep supervision (was 5)
  act_epsilon: 0.15  # Probability of forcing M_min >= 2

  # Optimizer
  optimizer: adam
  weight_decay: 0.01
  grad_clip: 1.0

  # Loss weights
  policy_weight: 1.0  # α
  value_weight: 2.0   # β — upweight to improve value head (lagging policy)
  act_weight: 0.1     # γ

mcts:
  simulations: 200  # More sims = cleaner policy/value targets for training
  max_segments_inference: 1  # Only 1 segment during MCTS inference
  batch_size: 16  # Batch size for GPU evaluation (Phase 2 optimization)
  puct_c: 1.5
  dirichlet_alpha: 1.0  # Higher for small action space (9 moves) — 10/N rule of thumb
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_threshold: 3  # Play greedily earlier for cleaner value signal (games are 5-9 moves)

selfplay:
  use_symmetry: true  # Augment each sample with all 8 D4 symmetries (8x data)
  num_workers: 2
  games_per_worker: 50
  replay_buffer_size: 20000  # Small buffer, fast turnover
  min_buffer_size: 3000  # Start training after this many positions

  # Opponent pool
  opponent_pool_size: 20
  recent_weight: 0.7  # 70% recent, 30% older checkpoints

evaluation:
  games: 100
  mcts_sims: 800  # More sims for evaluation
  win_rate_threshold: 0.55  # Accept new checkpoint if > 55% win rate

checkpointing:
  save_interval: 100  # Learner steps per epoch
  keep_checkpoints: 10
  checkpoint_dir: "checkpoints/tictactoe"